name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Create an empty draft release first, so the builds can upload to it.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create draft release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            printf 'Release %s\n' "$TAG" > notes.md
          fi
          gh release create "$TAG" --draft --title "attune $TAG" --notes-file notes.md

  build:
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p attune-cli --target ${{ matrix.target }}
      - name: Verify version matches the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          bin="target/${{ matrix.target }}/release/attune"
          if [ -f "$bin.exe" ]; then
            bin="$bin.exe"
          fi
          got="$("$bin" --version)"
          case "$got" in
            *"$version"*)
              echo "ok: $got"
              ;;
            *)
              echo "error: expected version $version, got: $got" >&2
              exit 1
              ;;
          esac
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/package.sh "$TAG" "target/${{ matrix.target }}/release/attune" dist
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/package.ps1 -Tag $env:TAG -Binary "target/${{ matrix.target }}/release/attune.exe" -OutDir dist
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for asset in dist/attune-*; do
            gh release upload "$TAG" "$asset"
          done

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -D dist
          cd dist
          sha256sum attune-* > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS
          gh release edit "$TAG" --draft=false --latest
