[package]
name = "attune-profile"
version = "0.1.0"
edition = "2021"
description = "Versioned Attune profile schema, validation and llama.cpp args (M4)"

[dependencies]
# AGENTS.md §1: attune-profile is a leaf crate and must stay dependency-free
# apart from these three: serde for the JSON contract, serde_json for the
# migration helper and thiserror for the parse error. Do not add anything else
# here without updating the architecture rule.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
