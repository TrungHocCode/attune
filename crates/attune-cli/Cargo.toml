[package]
name = "attune-cli"
version = "0.1.0"
edition = "2021"
description = "Attune CLI — thin wrapper over attune crates"

[[bin]]
name = "attune"
path = "src/main.rs"

[dependencies]
attune-hal = { path = "../attune-hal" }
attune-bench = { path = "../attune-bench" }
attune-estimate = { path = "../attune-estimate" }
attune-tune = { path = "../attune-tune" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
