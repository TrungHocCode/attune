[package]
name = "attune-cli"
version.workspace = true
edition.workspace = true
description = "Attune CLI — thin wrapper over attune crates"

[[bin]]
name = "attune"
path = "src/main.rs"

[dependencies]
attune-hal = { path = "../attune-hal" }
attune-bench = { path = "../attune-bench" }
attune-estimate = { path = "../attune-estimate" }
attune-tune = { path = "../attune-tune" }
attune-profile = { path = "../attune-profile" }
attune-serve = { path = "../attune-serve" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
