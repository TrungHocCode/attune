[package]
name = "attune-fetch"
version.workspace = true
edition.workspace = true
description = "Home dir and verified, resumable downloads for Attune (M6)"

# Leaf crate: depends on no other attune crate (AGENTS.md §1).
[dependencies]
thiserror = "2"
# Already used by attune-estimate; sync HTTP client with rustls for HTTPS model
# and llama.cpp downloads, no async runtime.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# SHA-256 of downloaded files (models, llama.cpp archives) is the integrity check.
sha2 = "0.11"
# Already used by attune-hal; free disk space before a multi-GB download.
sysinfo = "0.36"
# Unpack the pinned llama.cpp release: Windows ships .zip, Linux .tar.gz.
# deflate pulls flate2's pure-Rust zlib-rs backend (no C toolchain needed).
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

[dev-dependencies]
sha2 = "0.11"
