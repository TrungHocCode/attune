[package]
name = "attune-bench"
version.workspace = true
edition.workspace = true
description = "Micro-benchmarks for Attune (memory bandwidth, FLOPS, e2e)"

[dependencies]
# Plan §7: attune-bench depends ONLY on attune-hal (plus serde for the JSON
# contract). No clap/anyhow here — the CLI owns arg parsing and error context.
attune-hal = { path = "../attune-hal" }
# Justification: the resource monitor needs per-process RSS + CPU on Linux AND
# Windows through one code path. `sysinfo` is already the workspace-standard
# source of RAM/CPU facts (attune-hal uses it for `detect`), so this adds no
# new transitive dependency, only a second workspace consumer of it.
sysinfo = "0.36"
serde = { version = "1", features = ["derive"] }
thiserror = "1"

# serde_json is only needed by the tests that assert the JSON contract of
# `ReadResult`; the CLI already owns serialization for the end user.
[dev-dependencies]
serde_json = "1"
[target.'cfg(windows)'.dependencies]
# Justification (AGENTS 3.4): opt the process out of Windows power throttling
# (EcoQoS), which otherwise slows every probe after the first (34.7 -> 14 GB/s).
# Already in the lockfile via attune-backend/ctrlc.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
