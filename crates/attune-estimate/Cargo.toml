[package]
name = "attune-estimate"
version = "0.1.0"
edition = "2021"
description = "Roofline performance estimates for Attune (M3)"

[dependencies]
# Plan §7: attune-estimate builds predictions on top of measured hardware
# inputs from attune-bench. No clap/anyhow here — the CLI owns arg parsing.
attune-bench = { path = "../attune-bench" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
# config.json parsing + the on-disk catalog cache (the CLI still owns
# serializing the estimate report for the end user).
serde_json = "1"
# AGENTS §3 justification: sync-only HTTP client without an async runtime for
# ~2 KB config.json fetches. Default features are off and only `rustls` is
# enabled (TLS + webpki roots); gzip/brotli/charset/cookies are unnecessary.
ureq = { version = "3", default-features = false, features = ["rustls"] }
